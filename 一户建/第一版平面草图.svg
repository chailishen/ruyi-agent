<svg xmlns="http://www.w3.org/2000/svg" width="920" height="980" viewBox="0 0 920 980">
  <defs>
    <style>
      .label { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #25312d; }
      .small { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #4d5b55; }
      .title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: 700; fill: #1f2925; }
      .note { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #6b5850; }
      .wall { fill: none; stroke: #2e3a36; stroke-width: 6; }
      .thin { fill: none; stroke: #7b8a84; stroke-width: 2; }
      .dash { fill: none; stroke: #a87056; stroke-width: 3; stroke-dasharray: 8 7; }
      .dim { fill: none; stroke: #48544f; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .gate { stroke: #bb4b35; stroke-width: 9; stroke-linecap: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#48544f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="980" fill="#f8f5ee"/>
  <text x="100" y="45" class="title">第一版平面草图：东入中庭一层合院</text>
  <text x="100" y="70" class="note">示意图非施工比例；北上、南下、东右；宅基地 14m × 20m。</text>

  <rect x="680" y="80" width="200" height="800" fill="#e7e4dc" stroke="#c7c0b3" stroke-width="2"/>
  <text x="750" y="450" class="label" transform="rotate(90 750 450)">东侧 5 米道路</text>

  <rect x="100" y="80" width="560" height="800" fill="#fffaf0" stroke="#2e3a36" stroke-width="4"/>

  <text x="82" y="488" class="label" transform="rotate(-90 82 488)">西侧邻居</text>
  <text x="310" y="105" class="small">北侧邻居</text>
  <text x="310" y="905" class="small">南侧邻居</text>

  <line x1="100" y1="925" x2="660" y2="925" class="dim"/>
  <text x="350" y="955" class="label">东西 14m</text>
  <line x1="55" y1="80" x2="55" y2="880" class="dim"/>
  <text x="22" y="505" class="label" transform="rotate(-90 22 505)">南北 20m</text>

  <rect x="120" y="120" width="155" height="148" fill="#dfe8df" stroke="#61746b" stroke-width="2"/>
  <text x="158" y="195" class="label">主卧</text>
  <text x="145" y="220" class="small">约 14-16㎡</text>

  <rect x="120" y="278" width="155" height="145" fill="#e6eadf" stroke="#61746b" stroke-width="2"/>
  <text x="137" y="350" class="label">次卧/书房</text>
  <text x="145" y="375" class="small">可改客房</text>

  <rect x="285" y="120" width="95" height="303" fill="#f1eee5" stroke="#8c8f83" stroke-width="2"/>
  <text x="303" y="270" class="small" transform="rotate(90 303 270)">卧室区走廊</text>

  <rect x="390" y="120" width="80" height="92" fill="#d9e7ec" stroke="#5d7580" stroke-width="2"/>
  <text x="410" y="170" class="label">公卫</text>

  <rect x="480" y="120" width="125" height="132" fill="#f3dfc3" stroke="#9a7553" stroke-width="2"/>
  <text x="520" y="188" class="label">厨房</text>

  <rect x="608" y="120" width="52" height="132" fill="#ddd8ce" stroke="#837a6f" stroke-width="2"/>
  <text x="623" y="160" class="small" transform="rotate(90 623 160)">设备间</text>
  <text x="641" y="158" class="small" transform="rotate(90 641 158)">储水桶</text>

  <rect x="390" y="262" width="270" height="146" fill="#f4eadb" stroke="#9a7553" stroke-width="2"/>
  <text x="475" y="330" class="label">客厅 + 餐厅</text>
  <text x="472" y="356" class="small">面向中庭采光</text>

  <rect x="292" y="408" width="172" height="180" fill="#d8ead5" stroke="#668b64" stroke-width="3"/>
  <text x="338" y="492" class="label">中庭</text>
  <text x="318" y="520" class="small">约 4.3m × 4.5m</text>

  <rect x="474" y="420" width="76" height="168" fill="#f1eee5" stroke="#8c8f83" stroke-width="2"/>
  <text x="492" y="488" class="small" transform="rotate(90 492 488)">过厅</text>

  <rect x="120" y="600" width="180" height="235" fill="#e8e1d8" stroke="#8a7463" stroke-width="2"/>
  <text x="160" y="694" class="label">老人房</text>
  <text x="156" y="720" class="small">套间</text>
  <rect x="120" y="760" width="72" height="75" fill="#d9e7ec" stroke="#5d7580" stroke-width="2"/>
  <text x="137" y="804" class="small">独卫</text>

  <rect x="300" y="600" width="128" height="136" fill="#eadfc9" stroke="#927a55" stroke-width="2"/>
  <text x="338" y="665" class="label">茶室</text>
  <text x="323" y="692" class="small">看中庭</text>

  <rect x="438" y="600" width="88" height="136" fill="#f1eee5" stroke="#8c8f83" stroke-width="2"/>
  <text x="458" y="665" class="label">玄关</text>

  <rect x="526" y="600" width="134" height="230" fill="#e5e1d6" stroke="#8b806f" stroke-width="2"/>
  <text x="553" y="700" class="label">半露天</text>
  <text x="563" y="727" class="label">车位</text>
  <text x="544" y="755" class="small">靠东侧进出</text>

  <line x1="660" y1="680" x2="660" y2="800" class="gate"/>
  <text x="690" y="745" class="label">大门</text>
  <line x1="690" y1="800" x2="690" y2="880" class="dash"/>
  <text x="705" y="842" class="small">距南侧后墙</text>
  <text x="705" y="862" class="small">至少 2m</text>

  <path d="M 168 548 C 206 510, 252 510, 292 548" class="thin"/>
  <path d="M 332 548 C 366 518, 420 518, 454 548" class="thin"/>
  <text x="164" y="548" class="small">卧室、茶室、客餐厅尽量向中庭开窗</text>

  <g transform="translate(105 28)">
    <line x1="0" y1="38" x2="0" y2="0" stroke="#2e3a36" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="-10" y="58" class="small">北</text>
  </g>

  <text x="100" y="940" class="note">说明：本图用于讨论功能关系和大致位置，墙体厚度、结构柱网、门窗尺寸、排水坡度等需在深化阶段确定。</text>
</svg>
